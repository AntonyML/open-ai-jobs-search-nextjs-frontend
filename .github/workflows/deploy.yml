name: Deploy Cloudflare Worker

run-name: >
  Deploy ${{ github.event.inputs.environment }} @ ${{ github.ref_name }}
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        type: choice
        required: true
        default: production
        options:
          - production
          - preview

      confirm:
        description: "Type DEPLOY to confirm"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'

    name: Deploy to ${{ github.event.inputs.environment }}

    runs-on: ubuntu-latest

    timeout-minutes: 15

    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Restore OpenNext cache
        uses: actions/cache@v4
        with:
          path: .open-next
          key: opennext-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'wrangler.jsonc') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy to Cloudflare
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://open-ai-jobs-search-fastapi.fly.dev' }}
          NEXT_PUBLIC_DEBUG_SLIDE_MENU: ${{ vars.NEXT_PUBLIC_DEBUG_SLIDE_MENU || 'false' }}

      - name: Generate version tag
        id: version
        shell: bash
        run: |
          DATE_TAG=$(date +'v%Y.%m.%d')
          echo "VERSION=${DATE_TAG}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frontend-${{ steps.version.outputs.VERSION }}
          name: "Frontend ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🚀 Frontend desplegado

            **Entorno:** ${{ github.event.inputs.environment }}

            Haz clic para ver: https://open-ai-jobs-search.tonyml.com/es

            **Desplegado por:** @${{ github.actor }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false